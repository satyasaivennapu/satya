<mat-toolbar color="primary" class="mat-elevation-z4">
  <button mat-icon-button (click)="sidenav.toggle()" *ngIf="isHandset$ | async">
    <mat-icon>menu</mat-icon>
  </button>
  <span>CRM Dashboard</span>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav
               class="sidenav"
               [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
               [mode]="(isHandset$ | async) ? 'over' : 'side'"
               [opened]="(isHandset$ | async) === false"
               [fixedInViewport]="true"
               [fixedTopGap]="64">
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" (click)="(isHandset$ | async) && sidenav.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/revenue" routerLinkActive="active-link" (click)="(isHandset$ | async) && sidenav.close()">
        <mat-icon matListItemIcon>trending_up</mat-icon>
        <span matListItemTitle>Revenue</span>
      </a>
      <a mat-list-item routerLink="/expenses" routerLinkActive="active-link" (click)="(isHandset$ | async) && sidenav.close()">
        <mat-icon matListItemIcon>payment</mat-icon>
        <span matListItemTitle>Expenses</span>
      </a>
      <a mat-list-item routerLink="/tasks" routerLinkActive="active-link" (click)="(isHandset$ | async) && sidenav.close()">
        <mat-icon matListItemIcon>list_alt</mat-icon>
        <span matListItemTitle>Tasks</span>
      </a>
      <a mat-list-item routerLink="/customers" routerLinkActive="active-link" (click)="(isHandset$ | async) && sidenav.close()">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Customers</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
